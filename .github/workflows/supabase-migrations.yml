name: Supabase migrations

on:
  push:
    branches: [master]
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list pending migrations, do not apply them
        type: boolean
        default: false

# Never run two migrations against production at the same time.
concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: Push migrations to production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Keep this in sync with the "supabase" devDependency.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration state
        run: supabase migration list --linked

      - name: Dry run
        if: inputs.dry_run
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
